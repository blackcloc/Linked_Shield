# Gradle 设置
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.vfs.watch=false

# 网络不稳（libraries.minecraft.net 偶发握手失败）时加大超时与重试
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=1000

# Parchment 参数名映射
parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.20

# 环境版本（NeoForge 21.11.x == Minecraft 1.21.11）
minecraft_version=1.21.11
minecraft_version_range=[1.21.11]
neo_version=21.11.45

## 模组属性（注意：gradle.properties 按 ISO-8859-1 读取，
## 所以中文显示名/介绍写在 src/main/templates/META-INF/neoforge.mods.toml 里，
## 这里的 mod_name 只作为 ASCII 的英文名/打包参考）
mod_id=linkedshield
mod_name=Linked Shield
mod_authors=blackcloc
mod_license=All Rights Reserved
mod_version=1.0.4
mod_group_id=com.linkedshield
